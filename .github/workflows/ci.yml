name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      # Caches deps/ and _build/. The Dialyzer PLT lives at
      # _build/dev/dialyxir_erlang-*_elixir-*.plt, so it is covered here too and
      # needs no plt_local_path setting in mix.exs.
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-

      # Hex is a Mix archive, not a locked dependency: setup-beam installs
      # whatever is latest that day. Advisory checking only exists from Hex
      # 2.5.0, so pin it to keep the audit below meaningful and reproducible.
      - name: Pin Hex
        run: mix local.hex 2.5.1 --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      # The five gates documented in CONTRIBUTING.md, in the same order.
      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Test
        run: mix test

      - name: Lint
        run: mix credo --strict

      - name: Static analysis
        run: mix dialyzer

      # Reports retired packages and known security advisories. Blocking: the
      # tree has been clean since #10 was resolved. To accept a specific
      # advisory rather than fix it, record it under `hex: [ignore_advisories:
      # [...]]` in mix.exs with a reason, not by softening this step.
      - name: Audit dependencies
        shell: bash
        run: |
          set +e
          mix hex.audit > audit.log 2>&1
          status=$?
          set -e
          cat audit.log
          {
            if [ "$status" -eq 0 ]; then
              echo "## Dependency audit: clean"
            else
              echo "## Dependency audit: findings"
              echo
              echo '```'
              cat audit.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Build check only: this package publishes docs to HexDocs, so a hard
      # failure here would break a release. Pre-existing ex_doc warnings mean
      # --warnings-as-errors cannot be enabled yet.
      - name: Build docs
        run: mix docs

      # MIX_ENV is deliberately never set at the workflow level: cli/0 in mix.exs
      # sets preferred_envs, and an explicit MIX_ENV would override it and run
      # coveralls in the wrong environment.
      - name: Coverage
        shell: bash
        run: |
          mix coveralls.html | tee coverage.log
          total=$(grep -oE '\[TOTAL\][[:space:]]+[0-9.]+%' coverage.log | grep -oE '[0-9.]+%' || true)
          {
            echo "## Test coverage: ${total:-unknown}"
            echo
            echo "Generated modules and test support are excluded via \`coveralls.json\`."
            echo
            echo "<details><summary>Per-module breakdown</summary>"
            echo
            echo '```'
            sed -n '/^COV/,/^\[TOTAL\]/p' coverage.log
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: cover/excoveralls.html
          retention-days: 14

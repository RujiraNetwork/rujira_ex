name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.leg }})
    runs-on: ubuntu-latest

    # Two legs: the floor that mix.exs declares (`elixir: "~> 1.19"`), pinned
    # to the toolchain rujira-api runs, and the primary leg, which reads
    # .tool-versions so CI and local development cannot drift. Tooling-only
    # gates (Dialyzer, audit, docs, coverage) run on the primary leg alone.
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: floor
            otp: "28.1.1"
            elixir: "1.19.2"
            primary: false
          - leg: primary
            version-file: .tool-versions
            primary: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@v1
        # Exactly one of version-file / otp-version+elixir-version is set per
        # leg; setup-beam rejects a leg that sets both.
        with:
          version-file: ${{ matrix.version-file }}
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
          version-type: strict

      # Caches deps/ and _build/. The Dialyzer PLT lives at
      # _build/dev/dialyxir_erlang-*_elixir-*.plt, so it is covered here too and
      # needs no plt_local_path setting in mix.exs.
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      # The five gates documented in CONTRIBUTING.md, in the same order.
      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Test
        run: mix test

      - name: Lint
        run: mix credo --strict

      - name: Static analysis
        if: matrix.primary
        run: mix dialyzer

      # Hex is a Mix archive, not a dependency: neither mix.lock nor
      # .tool-versions pins it, and setup-beam installs whatever is latest.
      # Hex < 2.5.0 reports no advisories, so an unpinned Hex can change what the
      # audit below checks between runs with no commit here. Bump deliberately.
      - name: Pin Hex
        if: matrix.primary
        run: mix local.hex 2.6.0 --force

      # Reports retired packages and known security advisories. Blocking: this
      # library is published to Hex, so its dependency tree is every
      # consumer's. The findings also go to the run summary.
      - name: Audit dependencies
        if: matrix.primary
        shell: bash
        run: |
          set +e
          mix hex.audit > audit.log 2>&1
          status=$?
          set -e
          cat audit.log
          {
            if [ "$status" -eq 0 ]; then
              echo "## Dependency audit: clean"
            else
              echo "## Dependency audit: findings"
              echo
              echo '```'
              cat audit.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # This package publishes docs to HexDocs, so a broken reference fails CI
      # here rather than shipping as dead text.
      - name: Build docs
        if: matrix.primary
        run: mix docs --warnings-as-errors

      # MIX_ENV is deliberately never set at the workflow level: cli/0 in mix.exs
      # sets preferred_envs, and an explicit MIX_ENV would override it and run
      # coveralls in the wrong environment.
      - name: Coverage
        if: matrix.primary
        shell: bash
        run: |
          mix coveralls.html | tee coverage.log
          total=$(grep -oE '\[TOTAL\][[:space:]]+[0-9.]+%' coverage.log | grep -oE '[0-9.]+%' || true)
          {
            echo "## Test coverage: ${total:-unknown}"
            echo
            echo "Generated modules and test support are excluded via \`coveralls.json\`."
            echo
            echo "<details><summary>Per-module breakdown</summary>"
            echo
            echo '```'
            sed -n '/^COV/,/^\[TOTAL\]/p' coverage.log
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && matrix.primary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: cover/excoveralls.html
          retention-days: 14
